<!-- Cartão Inteiro -->
  <div class="cartao-login">
    
    <!-- Lado Esquerdo: Imagem do Carro -->
    <div class="lado-imagem"><img src="img/ranger.png" alt="Veículo Ford Ranger" class="imagem-carro"></div>

    <!-- Lado Direito: Formulário -->
    <div class="lado-formulario">
      <div class="logo"><img src="img/ford.png" alt="Logo Ford"></div>

      <h2>Boas-vindas</h2>

      <!-- Icones -->
      <form class="formulario">
        <div class="campo-input">
          <span class="icone">👤</span><input type="text" placeholder="Nome de usuário" required>
        </div>

        <div class="campo-input">
          <span class="icone">🔒</span><input type="password" placeholder="Senha" required>
        </div>

        <!-- Botão lembrar -->
        <div class="opcao-lembrar">
          <label><input type="checkbox"> Login automaticamente</label>
        </div>
        <button type="submit" class="botao-entrar">Entrar</button>

      </form>
    </div>
  </div>
