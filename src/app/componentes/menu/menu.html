 <!-- Cabecalho da pagina Inteiro -->
  <header class="cabecalho">
    
    <!-- Menu Hamburguer -->
    <div class="container-hamburguer">
      <input type="checkbox" id="menu-check" class="menu-check">
      <label for="menu-check" class="icone-hamburguer">
        <span class="linha"></span>
        <span class="linha"></span>
        <span class="linha"></span>
      </label>

      <!-- Menu Lateral (Painel) -->
      <nav class="menu-lateral">
        <div class="menu-header">
          <img src="img/ford.png" alt="Logo Ford" class="logo-menu">
          <label for="menu-check" class="botao-fechar">&times;</label>
        </div>

        <ul class="menu-opcoes">
          <li><a href="/src/app/pages/home/home.html">Home</a></li>
          <li><a href="/src/app/pages/dashboard/dashboard.html">Dashboard</a></li>
        </ul>
      </nav>
      
      <!-- Fundo do menu -->
      <label for="menu-check" class="fundo-escuro"></label>
    </div>

    <!-- Ícone de Conta (Perfil) -->
    <div class="container-conta">
      <input type="checkbox" id="conta-check" class="conta-check">
      
      <label for="conta-check" class="icone-conta" title="Minha Conta">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="#ffffff" viewBox="0 0 16 16">
          <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
          <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
        </svg>
      </label>

      <!-- Opcao de Sair -->
      <div class="dropdown-conta"><a href="/src/app/pages/login/login.html  " class="opcao-logout">Sair da conta</a></div>
    </div>
  </header>
